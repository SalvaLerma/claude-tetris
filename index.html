<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
      <button id="settings-btn" class="settings-btn" title="Ajustes" aria-label="Ajustes">⚙</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="gravity-toast" class="gravity-toast"></div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-stats" class="overlay-stats hidden"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="settings-overlay" class="overlay settings-overlay hidden">
      <div class="overlay-box settings-box">
        <p class="settings-title">AJUSTES</p>
        <div class="settings-list">
          <div class="setting-row">
            <label for="setting-gravity">Probabilidad de efecto gravedad</label>
            <div class="setting-control">
              <input type="range" id="setting-gravity" min="0" max="30" step="1" />
              <span class="setting-value" id="setting-gravity-value">1%</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="setting-nut">Probabilidad de pieza Tuerca</label>
            <div class="setting-control">
              <input type="range" id="setting-nut" min="0" max="30" step="1" />
              <span class="setting-value" id="setting-nut-value">8%</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="setting-start-speed">Velocidad inicial de caída</label>
            <div class="setting-control">
              <input type="range" id="setting-start-speed" min="300" max="1500" step="50" />
              <span class="setting-value" id="setting-start-speed-value">1000 ms</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="setting-speed-step">Incremento de velocidad por nivel</label>
            <div class="setting-control">
              <input type="range" id="setting-speed-step" min="0" max="200" step="10" />
              <span class="setting-value" id="setting-speed-step-value">90 ms</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="setting-min-speed">Velocidad mínima de caída</label>
            <div class="setting-control">
              <input type="range" id="setting-min-speed" min="50" max="500" step="10" />
              <span class="setting-value" id="setting-min-speed-value">100 ms</span>
            </div>
          </div>
        </div>
        <div class="settings-actions">
          <button id="settings-reset-btn" class="secondary-btn">Restablecer</button>
          <button id="settings-close-btn">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
